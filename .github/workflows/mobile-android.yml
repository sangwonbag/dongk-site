name: DK Floor Android test APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/mobile-storefront-pwa-20261112]
    paths:
      - 'mobile/**'
      - 'scripts/generate-pwa-icons.cjs'
      - '.github/workflows/mobile-android.yml'
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36 using preinstalled runner tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Install native dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        working-directory: mobile
        run: npm run prepare:android
      - name: Verify Google Play API level
        run: grep -q 'targetSdkVersion = 36' mobile/android/variables.gradle
      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Attach APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: dkfloor-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
